[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "re-verify"
version = "0.1.0"
description = "Evidence-grounded relation extraction with a compact, CPU-deployable language model"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# CPU inference (Linux wheels: pip install --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu)
infer = ["llama-cpp-python>=0.3.19,<0.4", "huggingface_hub>=1.0"]
train = ["torch>=2.4", "transformers==5.9.0", "peft==0.21.3", "accelerate==1.13.0", "datasets==4.8.4",
         "huggingface_hub>=1.0", "bitsandbytes"]
compete = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["reverify*"]

[tool.setuptools.package-data]
reverify = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
